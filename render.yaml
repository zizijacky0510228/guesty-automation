services:
  - type: web
    name: guesty-automation
    runtime: python
    plan: free
    buildCommand: echo "No build step required"
    startCommand: python3 guesty_webhook_server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: GUESTY_CLIENT_ID
        sync: false
      - key: GUESTY_CLIENT_SECRET
        sync: false
      - key: GUESTY_ALLOWED_PROPERTY_TOKENS
        value: "3505,383,2171,6550"
      - key: GUESTY_WEBHOOK_SECRET
        sync: false
      - key: GUESTY_WEBHOOK_SEND_ENABLED
        value: "false"
      - key: GUESTY_AI_REPLY_ENABLED
        value: "false"
      - key: GUESTY_AI_MIN_CONFIDENCE
        value: "0.78"
      - key: GUESTY_AI_CONTEXT_POST_LIMIT
        value: "8"
      - key: GUESTY_AI_HISTORY_BODY_CHARS
        value: "700"
      - key: GUESTY_AI_EXAMPLE_LIMIT
        value: "3"
      - key: GUESTY_AI_EXAMPLE_CHARS
        value: "280"
      - key: GUESTY_AI_OWNER_RULES_CHARS
        value: "3200"
      - key: GUESTY_AI_APPROVED_ANSWERS_CHARS
        value: "12000"
      - key: GUESTY_AI_REPLY_STYLE_CHARS
        value: "1400"
      - key: GUESTY_AI_LATEST_MESSAGE_CHARS
        value: "900"
      - key: OPENAI_MAX_COMPLETION_TOKENS
        value: "350"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.4-nano"
      - key: GUESTY_ALERT_EMAIL_ENABLED
        value: "true"
      - key: GUESTY_ALERT_EMAIL_TO
        value: "info@zhanhongltd.com"
      - key: GUESTY_ALERT_EMAIL_FROM
        sync: false
      - key: GUESTY_ALERT_SMTP_HOST
        value: "smtp.gmail.com"
      - key: GUESTY_ALERT_SMTP_PORT
        value: "587"
      - key: GUESTY_ALERT_SMTP_USERNAME
        sync: false
      - key: GUESTY_ALERT_SMTP_PASSWORD
        sync: false
      - key: GUESTY_ALERT_SMTP_STARTTLS
        value: "true"
