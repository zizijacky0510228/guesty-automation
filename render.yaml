services:
  - type: web
    name: guesty-automation
    runtime: python
    plan: free
    buildCommand: echo "No build step required"
    startCommand: python3 guesty_webhook_server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: GUESTY_CLIENT_ID
        sync: false
      - key: GUESTY_CLIENT_SECRET
        sync: false
      - key: GUESTY_ALLOWED_PROPERTY_TOKENS
        value: "3505,383,2171,6550,2030,5553"
      - key: GUESTY_WEBHOOK_SECRET
        sync: false
      - key: GUESTY_WEBHOOK_SEND_ENABLED
        value: "true"
      - key: GUESTY_AI_REPLY_ENABLED
        value: "true"
      - key: GUESTY_AI_MIN_CONFIDENCE
        value: "0.78"
      - key: GUESTY_AI_CONTEXT_POST_LIMIT
        value: "8"
      - key: GUESTY_AI_HISTORY_BODY_CHARS
        value: "700"
      - key: GUESTY_AI_EXAMPLE_LIMIT
        value: "3"
      - key: GUESTY_AI_EXAMPLE_CHARS
        value: "280"
      - key: GUESTY_AI_OWNER_RULES_CHARS
        value: "3200"
      - key: GUESTY_AI_APPROVED_ANSWERS_CHARS
        value: "12000"
      - key: GUESTY_AI_REPLY_STYLE_CHARS
        value: "1400"
      - key: GUESTY_AI_LATEST_MESSAGE_CHARS
        value: "900"
      - key: GUESTY_BACKSTOP_ENABLED
        value: "false"
      - key: OPENAI_MAX_COMPLETION_TOKENS
        value: "350"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.4-nano"
      - key: GUESTY_ALERT_EMAIL_ENABLED
        value: "true"
      - key: GUESTY_ALERT_EMAIL_TO
        value: "info@zhanhongltd.com"
      - key: GUESTY_ALERT_EMAIL_FROM
        sync: false
      - key: GUESTY_ALERT_SMTP_HOST
        value: "smtp.gmail.com"
      - key: GUESTY_ALERT_SMTP_PORT
        value: "587"
      - key: GUESTY_ALERT_SMTP_USERNAME
        sync: false
      - key: GUESTY_ALERT_SMTP_PASSWORD
        sync: false
      - key: GUESTY_ALERT_SMTP_STARTTLS
        value: "true"

  - type: keyvalue
    name: guesty-cleaning-state
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: cron
    name: guesty-cleaning-cloud-scheduler
    runtime: python
    plan: starter
    # Render cron uses UTC. These four UTC hours cover the 20:00 and 10:30
    # Vancouver windows in both daylight and standard time, with one retry slot.
    schedule: "0,30 3,4,17,18 * * *"
    buildCommand: echo "No build step required"
    startCommand: python3 guesty_cleaning_report.py --mode schedule
    envVars:
      - key: GUESTY_CLIENT_ID
        fromService:
          type: web
          name: guesty-automation
          envVarKey: GUESTY_CLIENT_ID
      - key: GUESTY_CLIENT_SECRET
        fromService:
          type: web
          name: guesty-automation
          envVarKey: GUESTY_CLIENT_SECRET
      - key: GUESTY_BASE_URL
        value: "https://open-api.guesty.com/v1"
      - key: GUESTY_TOKEN_URL
        value: "https://open-api.guesty.com/oauth2/token"
      - key: REPORT_TIMEZONE
        value: "America/Vancouver"
      - key: CLEANING_SEND_EMAIL
        value: "true"
      - key: CLEANING_EMAIL_TO
        value: "jacky.s@zhanhongltd.com,info@zhanhongltd.com"
      - key: CLEANING_ALERT_ON_MISSING_BASELINE
        value: "true"
      - key: CLEANING_STATE_REDIS_URL
        fromService:
          type: keyvalue
          name: guesty-cleaning-state
          property: connectionString
      - key: CLEANING_STATE_KEY_PREFIX
        value: "guesty-cleaning"
      - key: GUESTY_API_RETRY_ATTEMPTS
        value: "5"
      - key: GUESTY_API_RETRY_BASE_SECONDS
        value: "20"
      - key: GUESTY_API_RETRY_MAX_SECONDS
        value: "180"
      - key: CLEANING_SMTP_HOST
        value: "smtp.gmail.com"
      - key: CLEANING_SMTP_PORT
        value: "587"
      - key: CLEANING_SMTP_USERNAME
        fromService:
          type: web
          name: guesty-automation
          envVarKey: GUESTY_ALERT_SMTP_USERNAME
      - key: CLEANING_SMTP_PASSWORD
        fromService:
          type: web
          name: guesty-automation
          envVarKey: GUESTY_ALERT_SMTP_PASSWORD
      - key: CLEANING_EMAIL_FROM
        fromService:
          type: web
          name: guesty-automation
          envVarKey: GUESTY_ALERT_EMAIL_FROM
      - key: CLEANING_SMTP_STARTTLS
        value: "true"
      - key: CLEANING_SEND_WECOM
        value: "false"
